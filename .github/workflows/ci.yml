name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust Invariant Suite & Enclave Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test --all --verbose

  typescript-tests:
    name: TypeScript SDK & MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Tests
        run: bun test
      - name: Build Packages
        run: |
          bun run --filter aetherguard-sdk build
          bun run --filter aetherguard-mcp build
          bun run --filter aetherguard-eliza-plugin build

  python-tests:
    name: Python SDK & Agent Integrations Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python Invariant Tests
        run: |
          cd packages/python
          python -m unittest discover tests
      - name: Run Python Examples Verification
        run: |
          python packages/python/examples/basic_usage.py
          python packages/python/examples/langchain_agent.py
          python packages/python/examples/crewai_guard.py
          python packages/python/examples/llamaindex_agent.py
          python packages/python/examples/live_soroban_rpc_demo.py
