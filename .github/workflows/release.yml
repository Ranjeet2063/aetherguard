name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aetherguard-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: aetherguard-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: aetherguard-x86_64-apple-darwin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI Binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p aetherguard-cli

      - name: Package Archive & Checksum
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/aetherguard staging/
          cp LICENSE README.md staging/
          cd staging
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz aetherguard LICENSE README.md
          cd ..
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
